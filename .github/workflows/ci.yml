name: SOC Threat Incident Framework CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Synthetic Telemetry Data Generation
      run: |
        python src/data_generator.py

    - name: Execute Data Preprocessing & Feature Engineering
      run: |
        python src/feature_engineering.py

    - name: Train Baseline Model Pipelines
      # We override n_iter to 1 to ensure the CI runs extremely fast (under 2 minutes)
      run: |
        python src/model_training.py

    - name: Run Django Tests
      run: |
        python manage.py test

    - name: Verify Docker Container Build Integrity
      run: |
        docker build -t soc-framework-test:latest .
