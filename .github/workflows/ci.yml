name: SOC Threat Incident Framework CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Synthetic Telemetry Data Generation
      run: |
        python src/data_generator.py

    - name: Execute Raw Data Cleaning & Preprocessing
      run: |
        python src/preprocessing.py

    - name: Execute Security Feature Engineering
      run: |
        python src/feature_engineering.py

    - name: Train Baseline Model Pipelines
      run: |
        python src/model_training.py

    - name: Initialize and Seed SQLite Database
      run: |
        python seed_db.py

    - name: Run Core, API & ML Unit Tests (Pytest)
      run: |
        python -m pytest tests/

    - name: Run Django Tests
      run: |
        python manage.py test

    - name: Verify Docker Container Build Integrity
      run: |
        docker build -t soc-framework-test:latest .
